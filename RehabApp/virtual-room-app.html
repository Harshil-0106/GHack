<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rehab Virtual Room</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1e293b;
        }

        #phaser-game canvas {
            border: 4px solid #334155;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .wallet-hud {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-family: sans-serif;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="wallet-hud">🪙 <span id="token-balance">0</span> Tokens</div>

    <!-- Phaser Container -->
    <div id="phaser-game"></div>

    <!-- Include Scripts -->
    <script>
        window.addEventListener('error', function (e) {
            document.getElementById('phaser-game').innerText = e.message + " @ " + e.filename + ":" + e.lineno;
            document.getElementById('phaser-game').style.color = "red";
            document.getElementById('phaser-game').style.backgroundColor = "white";
            document.getElementById('phaser-game').style.padding = "20px";
        });
    </script>
    <script src="js/phaser.min.js"></script>
    <script src="js/core-state.js"></script>
    <script>
        // Bind tokens to HUD
        document.getElementById('token-balance').innerText = window.coreState.getState().tokens;
        window.addEventListener('stateChanged', (e) => {
            document.getElementById('token-balance').innerText = e.detail.tokens;
        });
    </script>
    <script src="js/virtual-room.js?v=2"></script>

    <!-- Viora Widget Integration -->
    <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }}
    </script>
    <script>
        window.VIORA_OPTIONS = { tag: 'Rehab Buddy', side: 'left' };
    </script>
    <script type="module" src="viora-widget/viora.js"></script>
</body>

</html>
